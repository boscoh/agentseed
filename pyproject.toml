[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentseed"
version = "0.1.0"
description = "Minimal pluggable LLM agent server (FastAPI + Pydantic AI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "httpx>=0.27.0",
    "cyclopts>=3.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-ai-slim[anthropic,openai,bedrock,groq]>=2.43.0",
    "boto3>=1.42.63",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/boscoh/agentseed"

[project.scripts]
agentseed = "agentseed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentseed"]
